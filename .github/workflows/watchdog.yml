# Сторож и ретранслятор алертов Pink Rivers (исходник — infra/watchdog в основном репо, публикуется
# в публичный репо pink-rivers-watchdog скриптом publish.sh: публичный — ради бесплатных минут Actions).
# Только schedule/workflow_dispatch: без pull_request, чтобы секреты не были доступны чужим форкам.
name: watchdog

on:
  schedule:
    # Не на ровных пятиминутках: на :00/:05 у GitHub пик нагрузки, запуски задерживаются и теряются.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # keepalive: GitHub выключает расписание в публичном репо после 60 дней без коммитов

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wd-state-${{ github.run_id }}
          restore-keys: wd-state-

      - name: watchdog
        id: wd
        run: node watchdog.mjs
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          OUTBOX_BUCKET: ${{ vars.OUTBOX_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_OUTBOX_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_OUTBOX_SECRET }}

      - name: save state
        if: steps.wd.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wd-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watchdog.yml/enable" --silent
        env:
          GH_TOKEN: ${{ github.token }}
